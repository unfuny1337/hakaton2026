<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAYLOAD ZERO</title>
<meta name="description" content="PAYLOAD ZERO — space mission design game">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css">
</head>
<body>

2 21h20M4 18C4 9 10 3 20 3m-5 0h5v5M4 18l3-2m1-7 3 2m4-7 1 3"/></symbol><symbol id="icon-director" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v5m0 12v5M1 12h5m12 0h5M4 4l4 4m8 8 4 4M20 4l-4 4M8 16l-4 4"/></symbol><symbol id="body-Moon" viewBox="0 0 128 128"><circle cx="64" cy="64" r="43"/><ellipse cx="64" cy="64" rx="58" ry="18" transform="rotate(-28 64 64)"/><circle cx="49" cy="48" r="10"/><circle cx="80" cy="77" r="13"/><circle cx="41" cy="82" r="5"/><circle cx="81" cy="40" r="5"/><path d="M23 64h82M64 21v86" opacity=".3"/></symbol><symbol id="body-Mars" viewBox="0 0 128 128"><circle cx="64" cy="64" r="41"/><ellipse cx="64" cy="64" rx="20" ry="58" transform="rotate(20 64 64)"/><path d="M45 30q19 12 37-2M33 70l17-7 17 8 22-12M48 93l17-8 20 7"/><circle cx="44" cy="45" r="5"/><circle cx="84" cy="92" r="4"/></symbol><symbol id="body-Earth" viewBox="0 0 128 128"><circle cx="64" cy="64" r="43"/><ellipse cx="64" cy="64" rx="21" ry="43"/><path d="M21 64h86M27 43h74M27 85h74M64 21v86M37 40l12 9-4 13 11 9-5 16M78 31l-8 15 10 9 12-5M80 71l12 9-8 10"/></symbol></defs></svg>
<a class="skip" href="#main" data-i18n="a11y.skip">Skip to content</a>
<header class="top" id="top">
  <div class="logo"><b>PAYLOAD ZERO</b><span data-i18n="app.tagline"></span></div>
  <div class="top-ctl" role="group" data-i18n-attr="aria-label:hdr.controls">
    <div class="seg lang-seg" role="group" data-i18n-attr="aria-label:lang.group">
      <button type="button" data-lang="uk" lang="uk" data-i18n-attr="aria-label:lang.uk;title:lang.uk">УКР</button>
      <button type="button" data-lang="en" lang="en" data-i18n-attr="aria-label:lang.en;title:lang.en">ENG</button>
    </div>
    <div class="seg" id="modeSeg" role="group" data-i18n-attr="aria-label:mode.group">
      <button type="button" data-mode="solo" class="on" aria-pressed="true" data-i18n="mode.solo">Solo</button>
      <button type="button" data-mode="team" aria-pressed="false" data-i18n="mode.team">Team</button>
    </div>
    <button type="button" id="helpBtn" class="btn sm ghost" data-i18n="hdr.help">Tutorial</button>
    <button type="button" id="shareBtn" class="btn sm ghost" data-i18n="hdr.share">Blueprint code</button>
    <button type="button" id="homeBtn" class="btn sm ghost" hidden data-i18n="hdr.missions">Missions</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <section id="s1" class="screen active" aria-labelledby="s1Title">
    <h1 class="h" id="s1Title" data-i18n="s1.title">Mission briefing</h1>
    <p class="lead" data-i18n="s1.intro"></p>
    <div id="draftBanner" class="banner" hidden></div>
    <div class="beginner panel">
      <p data-i18n="s1.beginner"></p>
      <div class="row">
        <button type="button" id="startEarthBtn" class="btn" data-i18n="s1.startEarth"></button>
        <button type="button" id="tutorialBtn" class="btn ghost" data-i18n="s1.tutorial"></button>
      </div>
    </div>
    <div id="missionCards" class="cards3"></div>
  </section>

  <section id="s2" class="screen" aria-labelledby="missionTitle">
    <ol class="stepbar" data-i18n-attr="aria-label:ux.route">
      <li><span class="step-no" aria-hidden="true">01</span><div><b data-i18n="ux.step1.title"></b><span data-i18n="ux.step1.desc"></span></div><svg class="ui-icon" aria-hidden="true"><use href="#icon-chassis"/></svg></li>
      <li><span class="step-no" aria-hidden="true">02</span><div><b data-i18n="ux.step2.title"></b><span data-i18n="ux.step2.desc"></span></div><svg class="ui-icon" aria-hidden="true"><use href="#icon-computer"/></svg></li>
      <li><span class="step-no" aria-hidden="true">03</span><div><b data-i18n="ux.step3.title"></b><span data-i18n="ux.step3.desc"></span></div><svg class="ui-icon" aria-hidden="true"><use href="#icon-rocket"/></svg></li>
    </ol>
    <div class="builder">
      <aside class="col catalog" id="catalog" data-i18n-attr="aria-label:catalog.aria">
        <div class="tabs" id="tabs" role="tablist" data-i18n-attr="aria-label:catalog.tabs">
          <button type="button" role="tab" id="tab-launch" data-tab="launch" aria-controls="catalogBody" class="on" aria-selected="true"><span data-i18n="tab.launch"></span><span class="tab-progress" aria-hidden="true"></span></button>
          <button type="button" role="tab" id="tab-bus" data-tab="bus" aria-controls="catalogBody" aria-selected="false" tabindex="-1"><span data-i18n="tab.bus"></span><span class="tab-progress" aria-hidden="true"></span></button>
          <button type="button" role="tab" id="tab-inst" data-tab="inst" aria-controls="catalogBody" aria-selected="false" tabindex="-1"><span data-i18n="tab.inst"></span><span class="tab-progress" aria-hidden="true"></span></button>
        </div>
        <p class="legend" data-i18n="legend.marks"></p>
        <div id="catalogBody" role="tabpanel" aria-labelledby="tab-launch"></div>
      </aside>

      <section class="col center">
        <div class="panel">
          <h2 class="ptitle" id="missionTitle">Blueprint</h2>
          <p id="goalLine" class="goal"></p>
          <svg id="bp" viewBox="0 0 420 300" role="group" aria-labelledby="bpDesc" data-target="Moon">
            <title id="bpDesc"></title>

            </defs>
            <rect class="cad-backdrop" width="420" height="300" fill="url(#g)"/>
            <g class="cad-background" aria-hidden="true">
              <use class="target-body target-Earth" href="#body-Earth" x="324" y="30" width="82" height="82"/>

              <path class="hull" d="M181 107h58l20 20v45l-20 21h-58l-20-21v-45z"/>

              <path class="energy-flow" d="M48 152h111m213 0H261"/>
            </g>
            <g class="node" data-k="comms" role="button" tabindex="0" data-i18n-attr="aria-label:cad.focus.comms">
              <path d="M205 107V90h10v17M185 73q25 36 50 0zM185 73q25 13 50 0M210 89V68m-4-4 4 4 4-4"/>
              <ellipse cx="210" cy="73" rx="25" ry="5"/>

            </g>
            <g class="node" data-k="battery" role="button" tabindex="0" data-i18n-attr="aria-label:cad.focus.battery">
              <rect x="180" y="132" width="28" height="21" rx="2"/><path d="M185 136v13m6-13v13m6-13v13m6-13v13M190 129h8v3"/>
            </g>
            <g class="node" data-k="computer" role="button" tabindex="0" data-i18n-attr="aria-label:cad.focus.computer">
              <rect x="216" y="132" width="23" height="21" rx="1"/><rect x="222" y="137" width="11" height="10"/>
              <path d="M220 129v3m5-3v3m5-3v3m5-3v3M220 153v3m5-3v3m5-3v3m5-3v3M213 137h3m-3 5h3m-3 5h3m23-10h3m-3 5h3m-3 5h3"/>
            </g>

            </g>
            <g class="node" data-k="propulsion" role="button" tabindex="0" data-i18n-attr="aria-label:cad.focus.propulsion">
              <path d="M202 193v10h16v-10M202 203l-14 29h44l-14-29M197 213h26m-30 10h34M194 193v14h-7m39-14v14h7"/>
              <path class="exhaust" d="m193 236-5 15m22-15v18m17-18 5 15M198 237l-2 9m28-9 2 9"/>
            </g>
            <g class="cad-mounts" aria-hidden="true"><path d="m179 185-75 57H67m127-49-31 49m62-49 32 49m-14-57 75 57h35"/></g>
            <g class="node" data-k="inst0" role="button" tabindex="0" data-i18n-attr="aria-label:cad.focus.inst"><path d="M54 241h26v24H54zM50 247h34M59 241v-6h16v6"/><circle cx="67" cy="254" r="7"/><circle cx="67" cy="254" r="3"/></g>
            <g class="node" data-k="inst1" role="button" tabindex="0" data-i18n-attr="aria-label:cad.focus.inst"><path d="M149 241h26v24h-26zM145 247h34M154 241v-6h16v6"/><circle cx="162" cy="254" r="7"/><circle cx="162" cy="254" r="3"/></g>
            <g class="node" data-k="inst2" role="button" tabindex="0" data-i18n-attr="aria-label:cad.focus.inst"><path d="M245 241h26v24h-26zM241 247h34M250 241v-6h16v6"/><circle cx="258" cy="254" r="7"/><circle cx="258" cy="254" r="3"/></g>
            <g class="node" data-k="inst3" role="button" tabindex="0" data-i18n-attr="aria-label:cad.focus.inst"><path d="M340 241h26v24h-26zM336 247h34M345 241v-6h16v6"/><circle cx="353" cy="254" r="7"/><circle cx="353" cy="254" r="3"/></g>
            <g class="cad-leaders" aria-hidden="true"><path d="M85 133v-17H10M235 77h46M259 165h27l14 18h108M180 143h-28l-18 52H10M239 143h34l27 60h108M239 171h30l31 50h108M193 222h-38l-16-2H10"/></g>
            <text class="lb" data-l="power" x="10" y="111"></text>
            <text class="lb" data-l="comms" x="282" y="74"></text>
            <text class="lb" data-l="chassis" x="302" y="180"></text>
            <text class="lb" data-l="battery" x="10" y="192"></text>
            <text class="lb" data-l="computer" x="302" y="200"></text>
            <text class="lb" data-l="thermal" x="302" y="218"></text>
            <text class="lb" data-l="propulsion" x="10" y="217"></text>
            <text class="lb" data-l="inst0" x="67" y="281" text-anchor="middle"></text>
            <text class="lb" data-l="inst1" x="162" y="281" text-anchor="middle"></text>
            <text class="lb" data-l="inst2" x="258" y="281" text-anchor="middle"></text>
            <text class="lb" data-l="inst3" x="353" y="281" text-anchor="middle"></text>
          </svg>
        </div>
        <div class="panel" id="teamPanel" hidden></div>
        <div class="panel" id="presetPanel"></div>
        <div class="panel">
          <h2 class="ptitle" data-i18n="adv.panel"></h2>
          <div id="advisors" class="advisors"></div>
        </div>
        <div class="panel" id="sharePanel"></div>
      </section>

      <aside class="col telem" id="telem" data-i18n-attr="aria-label:tel.aria">
        <div class="panel"><h2 class="ptitle" data-i18n="slots.title"></h2><div id="slots" class="slots"></div></div>
        <div class="panel"><h2 class="ptitle" data-i18n="tel.title"></h2><div id="bars"></div></div>
        <div class="panel"><h2 class="ptitle" data-i18n="diag.title"></h2><div id="diag" aria-live="polite"></div></div>
        <button type="button" id="launchBtn" class="launch" disabled aria-describedby="launchHint">LAUNCH</button>
        <p id="launchHint" class="hint"></p>
      </aside>
    </div>
    <div id="quickBar" class="quickbar" data-i18n-attr="aria-label:qb.aria">
      <div id="qbStats" class="qb-stats"></div>
      <button type="button" id="qbCheck" class="btn sm ghost" data-i18n="qb.check"></button>
      <button type="button" id="qbLaunch" class="btn sm"></button>
    </div>
  </section>

  <section id="s3" class="screen" aria-labelledby="s3Title">
    <h1 class="h" id="s3Title" data-i18n="s3.title"></h1>
    <p class="hint" data-i18n="s3.lockNote"></p>
    <ol id="phaseTrack" class="track" data-i18n-attr="aria-label:s3.track"></ol>
    <pre id="termLog" class="term" aria-live="polite" tabindex="0" data-i18n-attr="aria-label:s3.log"></pre>
    <div id="terminalAnnouncement" class="sr" aria-live="polite" aria-atomic="true"></div>
    <div class="row">
      <button type="button" id="abortBtn" class="btn ghost" data-i18n="s3.abort"></button>
      <button type="button" id="toReportBtn" class="btn" hidden data-i18n="s3.report"></button>
    </div>
  </section>

  <section id="s4" class="screen" aria-labelledby="repTitle">
    <div id="report"></div>
  </section>
</main>

<div id="crisis" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="crTitle" aria-describedby="crDesc">
  <div class="modal-box crisis-box">
    <div class="modal-head">
      <div class="alarm" data-i18n="cr.alarm"></div>
      <div class="seg lang-seg mini" role="group" data-i18n-attr="aria-label:lang.group">
        <button type="button" data-lang="uk" lang="uk" data-i18n-attr="aria-label:lang.uk;title:lang.uk">УКР</button>
        <button type="button" data-lang="en" lang="en" data-i18n-attr="aria-label:lang.en;title:lang.en">ENG</button>
      </div>
    </div>
    <h2 id="crTitle"></h2>
    <p id="crDesc"></p>
    <a id="crSrc" target="_blank" rel="noopener"></a>
    <div id="crTeam" class="cr-team" hidden></div>
    <p class="hint" id="crHint"></p>
    <div id="crOpts" class="opts" role="group" aria-labelledby="crHint"></div>
    <div class="row"><button type="button" id="crConfirm" class="btn" disabled></button></div>
  </div>
</div>

<div id="dlg" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="modal-box plain">
    <div class="modal-head">
      <h2 id="dlgTitle"></h2>
      <div class="seg lang-seg mini" role="group" data-i18n-attr="aria-label:lang.group">
        <button type="button" data-lang="uk" lang="uk" data-i18n-attr="aria-label:lang.uk;title:lang.uk">УКР</button>
        <button type="button" data-lang="en" lang="en" data-i18n-attr="aria-label:lang.en;title:lang.en">ENG</button>
      </div>
    </div>
    <div id="dlgBody"></div>
    <div class="row" id="dlgActions"></div>
  </div>
</div>

<div id="shareDlg" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="shareTitle">
  <div class="modal-box plain">
    <div class="modal-head">
      <h2 id="shareTitle" data-i18n="share.title"></h2>
      <div class="seg lang-seg mini" role="group" data-i18n-attr="aria-label:lang.group">
        <button type="button" data-lang="uk" lang="uk" data-i18n-attr="aria-label:lang.uk;title:lang.uk">УКР</button>
        <button type="button" data-lang="en" lang="en" data-i18n-attr="aria-label:lang.en;title:lang.en">ENG</button>
      </div>
    </div>
    <div id="shareExport"></div>
    <label for="importCode" class="lbl" data-i18n="share.importLabel"></label>
    <textarea id="importCode" class="code" rows="3" spellcheck="false" autocomplete="off" data-i18n-attr="placeholder:share.placeholder"></textarea>
    <p class="hint" id="importHint" data-i18n="share.importHint"></p>
    <div class="row">
      <button type="button" id="importBtn" class="btn" data-i18n="share.import"></button>
      <button type="button" id="shareClose" class="btn ghost" data-i18n="common.close"></button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="nasa_data.js"></script>
<script src="i18n.js"></script>
<script src="i18n-dict.js"></script>
<script src="engine.js"></script>
<script src="presets.js"></script>
<script src="ui.js"></script>
</body>
</html>
